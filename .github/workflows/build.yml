name: Build

# Every pull request, because a contributor cannot see a gate they are not run
# through: without this a PR arrives with no lint, no typecheck and no tests,
# and the first person to find out is whoever merges it.
#
# Pushes to master are covered too, so a direct push cannot skip what a PR
# must pass. `workflow_call` is what Release reuses; `workflow_dispatch` keeps
# the manual run.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm rules:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
