name: Deploy

# Deploys from a released tag, api first (see CONTRIBUTING.md).
#
# The two halves are no longer symmetrical. There are three apis, one per tool,
# and ONE web app: the console, which reads a site with every tool and lands
# them on a single verdict. So `tool` selects an api and `target` decides
# whether the console goes out with it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to deploy, e.g. 0.1.0 (checks out tag v0.1.0)"
        required: true
        type: string
      tool:
        description: "Which tool to deploy"
        required: true
        type: choice
        options:
          - slopmeter
          - leakpeek
          - citecheck
      target:
        description: "Which half of it"
        required: true
        default: both
        type: choice
        options:
          - both
          - api
          - console

# Never let two deploys of the same tool overlap; let an in-flight one finish.
concurrency:
  group: deploy-${{ inputs.tool }}
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  deploy-api:
    name: deploy ${{ inputs.tool }} api
    needs: verify
    if: inputs.target == 'both' || inputs.target == 'api'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: deploy ${{ inputs.tool }} api
        env:
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          LUMIOGUARD_API_BASE_URL: ${{ vars.LUMIOGUARD_API_BASE_URL }}
        run: pnpm --filter @lumioguard/${{ inputs.tool }}-api run deploy

  deploy-console:
    name: deploy console
    needs: [verify, deploy-api]
    # `always()` so a console-only deploy is not blocked by the api job being skipped.
    if: always() && needs.verify.result == 'success' && (inputs.target == 'both' || inputs.target == 'console') && needs.deploy-api.result != 'failure'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Baked into the bundle: Pages and the Workers are different origins, and
      # an origin is fixed at BUILD time. The console talks to all three, so all
      # three are set here. A missing one fails that tool's reading with a CORS
      # error and nothing useful in the console, while the other tools carry on,
      # which is exactly the failure that is easy to miss.
      #
      # VITE_LUMIOGUARD_APP_URL is THE switch for the optional integration. Left
      # unset - which is what a fork gets - the console ships with no hand-off
      # button, no offer and no LumioGuard wordmark anywhere on the page.
      - name: build console
        env:
          VITE_SLOPMETER_API_URL: ${{ vars.VITE_API_BASE_URL_SLOPMETER }}
          VITE_LEAKPEEK_API_URL: ${{ vars.VITE_API_BASE_URL_LEAKPEEK }}
          VITE_CITECHECK_API_URL: ${{ vars.VITE_API_BASE_URL_CITECHECK }}
          VITE_LUMIOGUARD_APP_URL: ${{ vars.VITE_LUMIOGUARD_APP_URL }}
          VITE_LUMIOGUARD_SITE_URL: ${{ vars.VITE_LUMIOGUARD_SITE_URL }}
          # Where this deployment answers. Unset, the build still succeeds and
          # ships with no canonical, no OpenGraph URL and no sitemap, saying so
          # on stderr. That is right for a fork and wrong for us, so the
          # variable is set on this repo.
          VITE_PUBLIC_SITE_URL: ${{ vars.VITE_PUBLIC_SITE_URL }}
          # Analytics, off unless VITE_POSTHOG_KEY is set, which is what a fork
          # gets. The origin above is the second guard: a build answering
          # anywhere else counts nothing, so a preview deploy stays out.
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          VITE_POSTHOG_UI_HOST: ${{ vars.VITE_POSTHOG_UI_HOST }}
        run: pnpm --filter @lumioguard/console run build

      - run: pnpm --filter @lumioguard/console run deploy
